name: Android
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Native dependencies
        run: |
          python3 scripts/bootstrap.py
          python3 -m venv .build-tools
          .build-tools/bin/pip install cmake==3.31.6 ninja==1.11.1.3
          .build-tools/bin/python scripts/configure_cmake.py
      - name: Compile, unit tests and lint
        run: bash gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --console plain
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-debug-and-reports
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
          retention-days: 14
